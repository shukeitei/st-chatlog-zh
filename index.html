<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌙</text></svg>"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="把星野 / 猫箱的聊天记录转换成 SillyTavern / Tavo 可导入的 jsonl 格式。全程在你的设备本地完成，不上传任何数据。"
    />
    <meta property="og:title" content="把白月光接回家 · 聊天记录转 SillyTavern" />
    <meta
      property="og:description"
      content="把星野 / 猫箱的聊天记录转换成 SillyTavern / Tavo 可导入的 jsonl 格式。全程本地完成，不上传任何数据。"
    />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://shukeitei.github.io/st-chatlog-zh/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="把白月光接回家 · 星野 / 猫箱 聊天记录转 SillyTavern / Tavo" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://shukeitei.github.io/st-chatlog-zh/og-image.png" />
    <title>把白月光接回家 · 聊天记录转 SillyTavern</title>
  </head>
  <body style="margin: 0; background: #fdfbf6">
    <div id="root">
      <div
        id="boot-fallback"
        style="
          min-height: 100vh;
          display: flex;
          align-items: center;
          justify-content: center;
          padding: 24px;
          background: #fdfbf6;
          color: #4a4237;
          font-family: system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
          text-align: center;
          line-height: 1.8;
        "
      >
        <div>
          <div style="font-size: 40px">🌙</div>
          <div id="boot-fallback-text" style="margin-top: 12px; font-size: 15px">页面加载中…</div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // 主 JS 在部分地区/浏览器可能拉取失败：React 挂载会清掉 boot-fallback，
      // 超时后它还在就说明没加载成功，把"加载中"换成可操作的提示
      setTimeout(function () {
        var el = document.getElementById('boot-fallback-text');
        if (!el) return;
        el.innerHTML =
          '页面没能加载出来 😿<br />' +
          '多半是网络到 GitHub 的线路不稳，不是工具坏了。<br />' +
          '可以：<b>刷新重试</b> · 换浏览器打开（Chrome / Edge / 夸克）· 有梯子开梯子<br /><br />' +
          '<button onclick="location.reload()" style="padding:10px 28px;font-size:15px;border:none;border-radius:10px;background:#8a6d4a;color:#fbf6ec;cursor:pointer">刷新重试</button>';
      }, 6000);
    </script>
    <noscript>
      <div style="padding: 24px; text-align: center; font-family: sans-serif">
        这个工具需要浏览器开启 JavaScript 才能用，请换浏览器或在设置里允许 JavaScript。
      </div>
    </noscript>
  </body>
</html>
